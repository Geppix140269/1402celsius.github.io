<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestiScope™ Pro - Professional Property Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const InvestiScopeScreenshotAnalyzer = () => {
          const [currentStep, setCurrentStep] = useState('upload');
          const [screenshots, setScreenshots] = useState([]);
          const [propertyUrl, setPropertyUrl] = useState('');
          const [analysisData, setAnalysisData] = useState(null);
          const [loading, setLoading] = useState(false);

          const handleFileUpload = (event) => {
            const files = Array.from(event.target.files);
            processFiles(files);
          };

          const handleDragOver = (event) => {
            event.preventDefault();
            event.currentTarget.classList.add('border-blue-400', 'bg-blue-50');
          };

          const handleDragLeave = (event) => {
            event.preventDefault();
            event.currentTarget.classList.remove('border-blue-400', 'bg-blue-50');
          };

          const handleDrop = (event) => {
            event.preventDefault();
            event.currentTarget.classList.remove('border-blue-400', 'bg-blue-50');
            const files = Array.from(event.dataTransfer.files);
            processFiles(files);
          };

          const processFiles = (files) => {
            const imageFiles = files.filter(file => file.type.startsWith('image/'));
            
            imageFiles.forEach(file => {
              const reader = new FileReader();
              reader.onload = (e) => {
                setScreenshots(prev => [...prev, {
                  id: Date.now() + Math.random(),
                  file: file,
                  preview: e.target.result,
                  name: file.name
                }]);
              };
              reader.readAsDataURL(file);
            });
          };

          const removeScreenshot = (id) => {
            setScreenshots(prev => prev.filter(img => img.id !== id));
          };

          const analyzeProperty = async () => {
            if (screenshots.length === 0) {
              alert('Please upload at least one screenshot');
              return;
            }

            setLoading(true);
            setCurrentStep('processing');
            
            setTimeout(() => {
              const mockAnalysis = generateIntelligentAnalysis();
              setAnalysisData(mockAnalysis);
              setCurrentStep('results');
              setLoading(false);
            }, 4000);
          };

          const generateIntelligentAnalysis = () => {
            const basePrice = Math.floor(Math.random() * 300000) + 150000;
            const location = getRandomPugliaLocation();
            
            return {
              property: {
                title: `${location.propertyType} in ${location.city}`,
                price: basePrice,
                location: `${location.city}, Puglia`,
                rooms: Math.floor(basePrice / 60000) + 1,
                bathrooms: Math.max(1, Math.floor(basePrice / 120000) + 1),
                size: Math.floor(basePrice / 1800),
                confidence: 0.85,
                analysisMethod: 'Expert screenshot analysis'
              },
              area: {
                touristAppeal: location.touristAppeal,
                marketTrend: location.marketTrend,
                rentalPotential: location.rentalPotential,
                investmentGrade: location.investmentGrade,
                averagePrice: location.averagePrice,
                priceGrowth: location.priceGrowth
              },
              miniPia: calculateMiniPia(basePrice, location.city),
              investment: calculateInvestmentMetrics(basePrice, location)
            };
          };

          const getRandomPugliaLocation = () => {
            const locations = [
              {
                city: 'Massafra',
                propertyType: 'Historic Villa',
                touristAppeal: 'Historical Ravines & Rupestrian Churches',
                marketTrend: '+8.5% annually',
                rentalPotential: '€80-150/night',
                investmentGrade: 'Grade A',
                averagePrice: '€1,200/m²',
                priceGrowth: '+38% (5-year outlook)'
              },
              {
                city: 'Alberobello',
                propertyType: 'Traditional Trullo',
                touristAppeal: 'UNESCO World Heritage Site',
                marketTrend: '+12.5% annually',
                rentalPotential: '€150-280/night',
                investmentGrade: 'Grade A+',
                averagePrice: '€2,800/m²',
                priceGrowth: '+45% (5-year outlook)'
              },
              {
                city: 'Ostuni',
                propertyType: 'White City Property',
                touristAppeal: 'White City of Puglia',
                marketTrend: '+10.2% annually',
                rentalPotential: '€120-220/night',
                investmentGrade: 'Grade A+',
                averagePrice: '€2,200/m²',
                priceGrowth: '+42% (5-year outlook)'
              },
              {
                city: 'Polignano a Mare',
                propertyType: 'Coastal Property',
                touristAppeal: 'Dramatic Coastal Cliffs',
                marketTrend: '+11.8% annually',
                rentalPotential: '€180-320/night',
                investmentGrade: 'Grade A+',
                averagePrice: '€3,500/m²',
                priceGrowth: '+48% (5-year outlook)'
              }
            ];
            
            return locations[Math.floor(Math.random() * locations.length)];
          };

          const calculateMiniPia = (propertyPrice, city) => {
            const renovationCosts = propertyPrice * 0.40;
            const hiddenCosts = propertyPrice * 0.15;
            const professionalServices = renovationCosts * 0.08;
            const totalProjectCosts = propertyPrice + renovationCosts + hiddenCosts + professionalServices;
            const miniPiaGrant = totalProjectCosts * 0.45;
            const outOfPocketCost = totalProjectCosts - miniPiaGrant;

            return {
              eligible: true,
              grantType: 'Mini PIA Puglia 2024',
              coverage: '45%',
              propertyPrice: Math.round(propertyPrice),
              renovationCosts: Math.round(renovationCosts),
              hiddenCosts: Math.round(hiddenCosts),
              professionalServices: Math.round(professionalServices),
              totalProjectCosts: Math.round(totalProjectCosts),
              miniPiaGrant: Math.round(miniPiaGrant),
              maxAmount: Math.round(miniPiaGrant),
              outOfPocketCost: Math.round(outOfPocketCost),
              refundable: false
            };
          };

          const calculateInvestmentMetrics = (price, location) => {
            const size = Math.floor(price / 1800);
            const pricePerSqm = size > 0 ? price / size : 1800;
            
            const rentalMatch = location.rentalPotential.match(/€(\d+)-(\d+)/);
            const avgNightlyRate = rentalMatch ? (parseInt(rentalMatch[1]) + parseInt(rentalMatch[2])) / 2 : 100;
            const annualRental = avgNightlyRate * 365 * 0.6;
            const yieldRate = price > 0 ? (annualRental / price) * 100 : 0;

            return {
              pricePerSqm: Math.round(pricePerSqm),
              estimatedYield: Math.round(yieldRate * 10) / 10 + '%',
              annualRental: Math.round(annualRental),
              breakEvenYears: yieldRate > 0 ? Math.round(100 / yieldRate) : 0,
              marketPosition: pricePerSqm < 2000 ? 'Below Market' : pricePerSqm < 3000 ? 'Market Rate' : 'Premium'
            };
          };

          const formatCurrency = (amount) => {
            return new Intl.NumberFormat('en-US', {
              style: 'currency',
              currency: 'EUR',
              minimumFractionDigits: 0
            }).format(amount);
          };

          const startOver = () => {
            setCurrentStep('upload');
            setScreenshots([]);
            setPropertyUrl('');
            setAnalysisData(null);
            setLoading(false);
          };

          const proceedToRegistration = () => {
            setCurrentStep('registration');
          };

          const submitRegistration = (event) => {
            event.preventDefault();
            const formData = new FormData(event.target);
            const userData = Object.fromEntries(formData);
            
            const message = `🏠 NEW QUALIFIED LEAD - InvestiScope™ Pro

👤 PROSPECT DETAILS:
Name: ${userData.firstName} ${userData.lastName}
Email: ${userData.email}
Phone: ${userData.phone}
Nationality: ${userData.nationality}
Investment Budget: ${userData.budget}
Timeline: ${userData.timeline}

🏡 PROPERTY ANALYSIS:
Property: ${analysisData.property.title}
Price: ${formatCurrency(analysisData.property.price)}
Location: ${analysisData.property.location}
Mini PIA Grant: ${formatCurrency(analysisData.miniPia.miniPiaGrant)}
Your Investment: ${formatCurrency(analysisData.miniPia.outOfPocketCost)}

📸 SCREENSHOTS PROVIDED: ${screenshots.length} image(s)

NEXT STEPS:
- Review uploaded screenshots
- Prepare detailed analysis report  
- Schedule consultation call
- Mini PIA application assistance

Generated by InvestiScope™ Pro`;

            const whatsappUrl = `https://wa.me/393514001402?text=${encodeURIComponent(message)}`;
            
            alert('✅ Analysis complete! Redirecting to WhatsApp...');
            window.open(whatsappUrl, '_blank');
            
            setTimeout(() => {
              startOver();
            }, 2000);
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-600 to-purple-700">
              <div className="container mx-auto px-4 py-8">
                <div className="text-center mb-8">
                  <h1 className="text-4xl md:text-5xl font-bold text-white mb-4">
                    🏠 InvestiScope™ Pro
                  </h1>
                  <p className="text-xl text-blue-100 mb-2">
                    Professional Property Analysis from Screenshots
                  </p>
                  <p className="text-blue-200">
                    Upload screenshots of any Italian property for instant expert analysis
                  </p>
                </div>

                {currentStep === 'upload' && (
                  <div className="max-w-4xl mx-auto">
                    <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
                      <div className="bg-gradient-to-r from-blue-600 to-purple-600 p-6">
                        <h2 className="text-2xl font-bold text-white">
                          📸 Upload Property Screenshots
                        </h2>
                        <p className="text-blue-100 mt-2">
                          Upload one or more screenshots of the property listing you're interested in
                        </p>
                      </div>

                      <div className="p-8">
                        <div className="mb-8 p-6 bg-blue-50 rounded-xl border-l-4 border-blue-400">
                          <h3 className="font-bold text-blue-800 mb-3">📋 What to Screenshot:</h3>
                          <div className="grid md:grid-cols-2 gap-4 text-blue-700">
                            <div>
                              <h4 className="font-semibold mb-2">✅ Essential Information:</h4>
                              <ul className="space-y-1 text-sm">
                                <li>• Property price</li>
                                <li>• Location/address</li>
                                <li>• Property size (m²)</li>
                                <li>• Number of rooms/bathrooms</li>
                              </ul>
                            </div>
                            <div>
                              <h4 className="font-semibold mb-2">📱 Screenshot Tips:</h4>
                              <ul className="space-y-1 text-sm">
                                <li>• Capture full property details</li>
                                <li>• Include multiple images if needed</li>
                                <li>• Ensure text is clearly readable</li>
                                <li>• Both mobile and desktop screenshots work</li>
                              </ul>
                            </div>
                          </div>
                        </div>

                        <div className="mb-6">
                          <label className="block text-gray-700 font-semibold mb-2">
                            Property URL (Optional)
                          </label>
                          <input
                            type="url"
                            placeholder="https://www.idealista.it/immobile/12345678/ (optional)"
                            value={propertyUrl}
                            onChange={(e) => setPropertyUrl(e.target.value)}
                            className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none"
                          />
                          <p className="text-gray-500 text-sm mt-1">
                            Paste the property URL here for our reference (optional)
                          </p>
                        </div>

                        <div
                          onDragOver={handleDragOver}
                          onDragLeave={handleDragLeave}
                          onDrop={handleDrop}
                          className="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-blue-400 transition-all duration-300 cursor-pointer"
                        >
                          <div className="space-y-4">
                            <div className="text-6xl">📷</div>
                            <div>
                              <p className="text-xl font-semibold text-gray-700 mb-2">
                                Drag & drop screenshots here
                              </p>
                              <p className="text-gray-500 mb-4">or click to browse your files</p>
                            </div>
                            
                            <input
                              type="file"
                              accept="image/*"
                              multiple
                              onChange={handleFileUpload}
                              className="hidden"
                              id="file-upload"
                            />
                            <label
                              htmlFor="file-upload"
                              className="inline-block bg-gradient-to-r from-blue-600 to-purple-600 text-white px-8 py-3 rounded-lg cursor-pointer hover:shadow-lg transition-all duration-300 font-semibold"
                            >
                              📁 Choose Screenshots
                            </label>
                          </div>
                        </div>

                        {screenshots.length > 0 && (
                          <div className="mt-8">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4">
                              📸 Uploaded Screenshots ({screenshots.length})
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
                              {screenshots.map((screenshot) => (
                                <div key={screenshot.id} className="relative group">
                                  <img
                                    src={screenshot.preview}
                                    alt="Property screenshot"
                                    className="w-full h-48 object-cover rounded-lg border border-gray-200"
                                  />
                                  <button
                                    onClick={() => removeScreenshot(screenshot.id)}
                                    className="absolute top-2 right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs hover:bg-red-600 transition-colors opacity-0 group-hover:opacity-100"
                                  >
                                    ×
                                  </button>
                                  <p className="text-sm text-gray-600 mt-2 truncate">
                                    {screenshot.name}
                                  </p>
                                </div>
                              ))}
                            </div>

                            <button
                              onClick={analyzeProperty}
                              className="w-full bg-gradient-to-r from-green-600 to-blue-600 text-white py-4 px-8 rounded-xl text-lg font-bold hover:shadow-xl transition-all duration-300"
                            >
                              🚀 Analyze Property Now
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {currentStep === 'processing' && (
                  <div className="max-w-2xl mx-auto">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 text-center">
                      <div className="space-y-6">
                        <div className="text-6xl animate-bounce">🔍</div>
                        <h2 className="text-3xl font-bold text-gray-800">
                          Analyzing Your Property...
                        </h2>
                        <div className="space-y-3 text-gray-600">
                          <p className="flex items-center justify-center">
                            <span className="animate-spin mr-2">⚙️</span>
                            Processing uploaded screenshots
                          </p>
                          <p className="flex items-center justify-center">
                            <span className="animate-pulse mr-2">📊</span>
                            Extracting property details
                          </p>
                          <p className="flex items-center justify-center">
                            <span className="animate-pulse mr-2">💰</span>
                            Calculating Mini PIA eligibility
                          </p>
                          <p className="flex items-center justify-center">
                            <span className="animate-pulse mr-2">📈</span>
                            Generating investment analysis
                          </p>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-3">
                          <div className="bg-gradient-to-r from-blue-600 to-purple-600 h-3 rounded-full animate-pulse" style={{width: '85%'}}></div>
                        </div>
                        <p className="text-sm text-gray-500">
                          Our experts are reviewing your screenshots...
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {currentStep === 'results' && analysisData && (
                  <div className="max-w-6xl mx-auto space-y-6">
                    <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
                      <div className="bg-gradient-to-r from-green-600 to-blue-600 p-6">
                        <h2 className="text-2xl font-bold text-white">
                          ✅ Property Analysis Complete
                        </h2>
                        <p className="text-green-100 mt-2">
                          Professional analysis based on your uploaded screenshots
                        </p>
                      </div>

                      <div className="p-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                          <div className="bg-blue-50 p-6 rounded-xl border-l-4 border-blue-500">
                            <div className="text-blue-600 text-sm font-semibold mb-1">Property Price</div>
                            <div className="text-3xl font-bold text-blue-800">
                              {formatCurrency(analysisData.property.price)}
                            </div>
                          </div>
                          <div className="bg-green-50 p-6 rounded-xl border-l-4 border-green-500">
                            <div className="text-green-600 text-sm font-semibold mb-1">Location</div>
                            <div className="text-xl font-bold text-green-800">
                              {analysisData.property.location}
                            </div>
                          </div>
                          <div className="bg-purple-50 p-6 rounded-xl border-l-4 border-purple-500">
                            <div className="text-purple-600 text-sm font-semibold mb-1">Property Size</div>
                            <div className="text-2xl font-bold text-purple-800">
                              {analysisData.property.size} m²
                            </div>
                          </div>
                          <div className="bg-orange-50 p-6 rounded-xl border-l-4 border-orange-500">
                            <div className="text-orange-600 text-sm font-semibold mb-1">Investment Grade</div>
                            <div className="text-xl font-bold text-orange-800">
                              {analysisData.area.investmentGrade}
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
                      <div className="bg-gradient-to-r from-yellow-500 to-orange-500 p-6">
                        <h2 className="text-2xl font-bold text-white">
                          💰 Mini PIA Grant Analysis
                        </h2>
                        <p className="text-yellow-100 mt-2">
                          Non-refundable grant potential for your Puglia property investment
                        </p>
                      </div>

                      <div className="p-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                          <div>
                            <h3 className="text-xl font-bold text-green-600 mb-4">✅ Grant Eligible!</h3>
                            <div className="space-y-3 bg-green-50 p-6 rounded-xl">
                              <div className="flex justify-between">
                                <span className="text-gray-700">Property Price:</span>
                                <span className="font-semibold">{formatCurrency(analysisData.miniPia.propertyPrice)}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-gray-700">Renovation Costs:</span>
                                <span className="font-semibold">{formatCurrency(analysisData.miniPia.renovationCosts)}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-gray-700">Additional Costs:</span>
                                <span className="font-semibold">{formatCurrency(analysisData.miniPia.hiddenCosts + analysisData.miniPia.professionalServices)}</span>
                              </div>
                              <hr className="border-gray-300" />
                              <div className="flex justify-between text-lg font-bold">
                                <span className="text-gray-800">Total Project:</span>
                                <span className="text-blue-600">{formatCurrency(analysisData.miniPia.totalProjectCosts)}</span>
                              </div>
                            </div>
                          </div>

                          <div>
                            <h3 className="text-xl font-bold text-purple-600 mb-4">🎯 Your Investment</h3>
                            <div className="space-y-4">
                              <div className="bg-purple-50 p-6 rounded-xl border-l-4 border-purple-500">
                                <div className="text-purple-600 text-sm font-semibold mb-1">Mini PIA Grant (45%)</div>
                                <div className="text-3xl font-bold text-purple-800">
                                  -{formatCurrency(analysisData.miniPia.miniPiaGrant)}
                                </div>
                                <div className="text-purple-600 text-sm mt-1">Non-refundable funding</div>
                              </div>
                              
                              <div className="bg-blue-50 p-6 rounded-xl border-l-4 border-blue-500">
                                <div className="text-blue-600 text-sm font-semibold mb-1">Your Required Investment</div>
                                <div className="text-3xl font-bold text-blue-800">
                                  {formatCurrency(analysisData.miniPia.outOfPocketCost)}
                                </div>
                                <div className="text-blue-600 text-sm mt-1">After Mini PIA grant</div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="bg-gradient-to-r from-orange-500 to-red-500 rounded-2xl shadow-2xl p-8 text-white text-center">
                      <h3 className="text-3xl font-bold mb-4">🚀 Ready to Move Forward?</h3>
                      <p className="text-xl mb-6">
                        Get personalized guidance on mortgage options, legal requirements, and Mini PIA application process
                      </p>
                      
                      <div className="flex flex-col sm:flex-row gap-4 justify-center">
                        <button 
                          onClick={proceedToRegistration}
                          className="bg-white text-orange-600 px-8 py-4 rounded-xl text-lg font-bold hover:shadow-xl transition-all duration-300"
                        >
                          📋 Get Premium Consultation
                        </button>
                        <button 
                          onClick={startOver}
                          className="border-2 border-white text-white px-8 py-4 rounded-xl text-lg font-bold hover:bg-white hover:text-orange-600 transition-all duration-300"
                        >
                          🔍 Analyze Another Property
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {currentStep === 'registration' && (
                  <div className="max-w-2xl mx-auto">
                    <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
                      <div className="bg-gradient-to-r from-purple-600 to-pink-600 p-6">
                        <h2 className="text-2xl font-bold text-white">
                          📋 Investment Consultation Request
                        </h2>
                        <p className="text-purple-100 mt-2">
                          Get personalized guidance for your Italian property investment
                        </p>
                      </div>

                      <form onSubmit={submitRegistration} className="p-8 space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-gray-700 font-semibold mb-2">First Name *</label>
                            <input
                              type="text"
                              name="firstName"
                              required
                              className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:outline-none"
                            />
                          </div>
                          <div>
                            <label className="block text-gray-700 font-semibold mb-2">Last Name *</label>
                            <input
                              type="text"
                              name="lastName"
                              required
                              className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:outline-none"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-gray-700 font-semibold mb-2">Email Address *</label>
                          <input
                            type="email"
                            name="email"
                            required
                            className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-gray-700 font-semibold mb-2">Phone Number</label>
                          <input
                            type="tel"
                            name="phone"
                            className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:outline-none"
                          />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-gray-700 font-semibold mb-2">Nationality *</label>
                            <select
                              name="nationality"
                              required
                              className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:outline-none"
                            >
                              <option value="">Select nationality</option>
                              <option value="UK">United Kingdom</option>
                              <option value="US">United States</option>
                              <option value="CA">Canada</option>
                              <option value="AU">Australia</option>
                              <option value="DE">Germany</option>
                              <option value="FR">France</option>
                              <option value="NL">Netherlands</option>
                              <option value="other">Other</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-gray-700 font-semibold mb-2">Investment Budget *</label>
                            <select
                              name="budget"
                              required
                              className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:outline-none"
                            >
                              <option value="">Select budget</option>
                              <option value="100-300k">€100,000 - €300,000</option>
                              <option value="300-500k">€300,000 - €500,000</option>
                              <option value="500k-1m">€500,000 - €1,000,000</option>
                              <option value="1m+">€1,000,000+</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-gray-700 font-semibold mb-2">Purchase Timeline *</label>
                          <select
                            name="timeline"
                            required
                            className="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:outline-none"
                          >
                            <option value="">Select timeline</option>
                            <option value="immediate">Ready to proceed immediately</option>
                            <option value="3-months">Within 3 months</option>
                            <option value="6-months">Within 6 months</option>
                            <option value="12-months">Within 12 months</option>
                            <option value="exploring">Just exploring options</option>
                          </select>
                        </div>

                        <button
                          type="submit"
                          className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-4 px-8 rounded-xl text-lg font-bold hover:shadow-xl transition-all duration-300"
                        >
                          🚀 Request Expert Consultation
                        </button>

                        <button
                          type="button"
                          onClick={() => setCurrentStep('results')}
                          className="w-full text-gray-600 hover:text-gray-800 transition-colors"
                        >
                          ← Back to Analysis Results
                        </button>
                      </form>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        };

        ReactDOM.render(<InvestiScopeScreenshotAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
